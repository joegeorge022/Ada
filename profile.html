<body>
    <a href="/" class="back-button">
        <i class="fas fa-arrow-left"></i>
        Back to Chat
    </a>
    <div class="profile-container">
        <div class="profile-header">
            <h1 class="profile-title">User Profile</h1>
        </div>
        <div class="profile-card">
            <div class="profile-info" id="loading-overlay">
                <div class="loader"></div>
                <div style="margin-top: 15px; color: white;">Loading profile data...</div>
            </div>
            <div class="profile-info" id="profile-content" style="display: none;">
                <img id="profile-avatar" class="profile-avatar" src="images/chat.jpg" alt="User Avatar">
                <h2 id="profile-name" class="profile-name">User Name</h2>
                <p id="profile-email" class="profile-email">user@example.com</p>
                
                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="conversations-count">0</div>
                        <div class="stat-label">Conversations</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="messages-count">0</div>
                        <div class="stat-label">Messages</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="days-member">0</div>
                        <div class="stat-label">Days</div>
                    </div>
                </div>
            </div>
            
            <div class="profile-section">
                <h3 class="section-title">Account Management</h3>
                <div class="account-actions">
                    <button class="action-button" id="edit-profile-button">
                        <i class="fas fa-user-edit"></i> Edit Profile
                    </button>
                    <button class="action-button" id="change-password-button">
                        <i class="fas fa-key"></i> Change Password
                    </button>
                    <button class="action-button danger" id="delete-account-button">
                        <i class="fas fa-trash-alt"></i> Delete Account
                    </button>
                </div>
                
                <button class="sign-out-button" id="sign-out-button">Sign Out</button>
            </div>
        </div>
    </div>
    
    <div class="delete-account-modal" id="delete-account-modal">
        <div class="modal-content">
            <h3 class="modal-title">Delete Your Account</h3>
            <p class="modal-text">Are you sure you want to delete your account? This action cannot be undone, and all your data will be permanently removed.</p>
            <div class="modal-actions">
                <button class="modal-button cancel" id="cancel-delete-button">Cancel</button>
                <button class="modal-button confirm" id="confirm-delete-button">Delete Account</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loadingOverlay = document.getElementById('loading-overlay');
            const profileContent = document.getElementById('profile-content');
            const profileAvatar = document.getElementById('profile-avatar');
            const profileName = document.getElementById('profile-name');
            const profileEmail = document.getElementById('profile-email');
            const deleteAccountButton = document.getElementById('delete-account-button');
            const deleteAccountModal = document.getElementById('delete-account-modal');
            const cancelDeleteButton = document.getElementById('cancel-delete-button');
            const confirmDeleteButton = document.getElementById('confirm-delete-button');
            const signOutButton = document.getElementById('sign-out-button');
            const editProfileButton = document.getElementById('edit-profile-button');
            const changePasswordButton = document.getElementById('change-password-button');
            
            const conversationsCount = document.getElementById('conversations-count');
            const messagesCount = document.getElementById('messages-count');
            const daysMember = document.getElementById('days-member');
            
            async function initializeClerk() {
                if (!window.Clerk) {
                    setTimeout(initializeClerk, 500);
                    return;
                }
                
                try {
                    await window.Clerk.load();
                    
                    if (!window.Clerk.user) {
                        window.location.href = '/login.html';
                        return;
                    }
                    
                    const user = window.Clerk.user;
                    
                    profileName.textContent = user.fullName || user.username || 'User';
                    profileEmail.textContent = user.primaryEmailAddress?.emailAddress || '';
                    
                    if (user.imageUrl) {
                        profileAvatar.src = user.imageUrl;
                    }
                    
                    const now = new Date();
                    const createdAt = new Date(user.createdAt);
                    const daysSinceCreation = Math.floor((now - createdAt) / (1000 * 60 * 60 * 24));
                    
                    daysMember.textContent = daysSinceCreation || 1;
                    
                    try {
                        const chatHistory = JSON.parse(localStorage.getItem('chatHistory') || '[]');
                        messagesCount.textContent = chatHistory.length;
                        
                        conversationsCount.textContent = Math.max(1, Math.ceil(chatHistory.length / 10));
                    } catch (e) {
                        messagesCount.textContent = '0';
                        conversationsCount.textContent = '0';
                    }
                    
                    loadingOverlay.style.display = 'none';
                    profileContent.style.display = 'flex';
                    
                } catch (error) {
                    console.error('Error initializing Clerk:', error);
                    alert('Failed to load profile data. Please try again later.');
                    window.location.href = '/';
                }
            }
            
            initializeClerk();
            
            deleteAccountButton.addEventListener('click', function() {
                deleteAccountModal.classList.add('active');
            });
            
            cancelDeleteButton.addEventListener('click', function() {
                deleteAccountModal.classList.remove('active');
            });
            
            confirmDeleteButton.addEventListener('click', async function() {
                try {
                    if (window.Clerk && window.Clerk.user) {
                        await window.Clerk.user.delete();
                        alert('Your account has been deleted successfully.');
                        window.location.href = '/';
                    }
                } catch (error) {
                    console.error('Error deleting account:', error);
                    alert('Failed to delete account. Please try again later.');
                    deleteAccountModal.classList.remove('active');
                }
            });
            
            signOutButton.addEventListener('click', async function() {
                try {
                    if (window.Clerk) {
                        await window.Clerk.signOut();
                        window.location.href = '/';
                    }
                } catch (error) {
                    console.error('Error signing out:', error);
                    alert('Failed to sign out. Please try again.');
                }
            });
            
            editProfileButton.addEventListener('click', function() {
                if (window.Clerk) {
                    window.Clerk.openUserProfile();
                }
            });
            
            changePasswordButton.addEventListener('click', function() {
                if (window.Clerk) {
                    window.Clerk.openUserProfile({
                        initialPage: 'security'
                    });
                }
            });
        });
    </script>
