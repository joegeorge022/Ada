<body>
    <a href="/" class="back-button">
        <i class="fas fa-arrow-left"></i>
        Back to Chat
    </a>
    <div class="login-container">
        <div class="ada-welcome">
            <img src="images/chat.jpg" alt="Ada" class="ada-avatar">
            <h1 class="welcome-text">I've Missed You!</h1>
            <p class="welcome-subtext">Let's continue our conversation...</p>
        </div>
        <div id="auth-container">
            <div class="auth-tabs">
                <button id="signin-tab" class="auth-tab active">Sign In</button>
                <button id="signup-tab" class="auth-tab">Sign Up</button>
            </div>
            <div id="auth-views">
                <div id="signin-view" class="active">
                    <div class="loader"></div>
                    <div style="text-align: center; margin-top: 10px;">Loading authentication...</div>
                </div>
                <div id="signup-view">
                    <div class="loader"></div>
                    <div style="text-align: center; margin-top: 10px;">Loading sign-up form...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const signinView = document.getElementById('signin-view');
            const signupView = document.getElementById('signup-view');
            const signinTab = document.getElementById('signin-tab');
            const signupTab = document.getElementById('signup-tab');
            
            signinTab.addEventListener('click', () => {
                signinTab.classList.add('active');
                signupTab.classList.remove('active');
                signinView.classList.add('active');
                signupView.classList.remove('active');
            });
            
            signupTab.addEventListener('click', () => {
                signupTab.classList.add('active');
                signinTab.classList.remove('active');
                signupView.classList.add('active');
                signinView.classList.remove('active');
            });

            let attempts = 0;
            const maxAttempts = 10;
            
            function initializeClerk() {
                if (window.Clerk) {
                    window.Clerk.load()
                        .then(() => {
                            signinView.innerHTML = '';
                            signupView.innerHTML = '';
                            
                            window.Clerk.mountSignIn(signinView, {
                                appearance: {
                                    elements: {
                                        rootBox: {
                                            boxShadow: 'none',
                                            width: '100%'
                                        },
                                        card: {
                                            border: 'none',
                                            boxShadow: 'none',
                                            backgroundColor: 'transparent'
                                        }
                                    }
                                }
                            });
                            
                            window.Clerk.mountSignUp(signupView, {
                                appearance: {
                                    elements: {
                                        rootBox: {
                                            boxShadow: 'none',
                                            width: '100%'
                                        },
                                        card: {
                                            border: 'none',
                                            boxShadow: 'none',
                                            backgroundColor: 'transparent'
                                        }
                                    }
                                }
                            });
                            
                            setTimeout(() => {
                                if (signinView.classList.contains('active')) {
                                    signinTab.click();
                                } else {
                                    signupTab.click();
                                }
                            }, 100);
                        })
                        .catch(error => {
                            console.error('Error loading Clerk:', error);
                            const errorMessage = `
                                <div style="text-align: center; color: white;">
                                    <p>Failed to load authentication. Please try again.</p>
                                    <button onclick="window.location.reload()" 
                                            style="background: rgba(255, 46, 136, 0.2); border: 1px solid var(--neon-pink); 
                                                   color: white; padding: 10px 15px; margin-top: 15px; cursor: pointer; 
                                                   border-radius: 5px;">
                                        Retry
                                    </button>
                                </div>
                            `;
                            signinView.innerHTML = errorMessage;
                            signupView.innerHTML = errorMessage;
                        });
                } else if (attempts < maxAttempts) {
                    attempts++;
                    setTimeout(initializeClerk, 500);
                } else {
                    const errorMessage = `
                        <div style="text-align: center; color: white;">
                            <p>Authentication service failed to load. Please refresh the page.</p>
                            <button onclick="window.location.reload()" 
                                    style="background: rgba(255, 46, 136, 0.2); border: 1px solid var(--neon-pink); 
                                           color: white; padding: 10px 15px; margin-top: 15px; cursor: pointer; 
                                           border-radius: 5px;">
                                Refresh Page
                            </button>
                        </div>
                    `;
                    signinView.innerHTML = errorMessage;
                    signupView.innerHTML = errorMessage;
                }
            }

            initializeClerk();
        });
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
